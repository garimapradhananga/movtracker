<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stats - MovTracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container mt-5">
    <a href="/" class="btn btn-outline-light mb-4">← Back</a>
    <h1 class="page-title mb-5">📊 Your Stats</h1>

    <div class="row mb-5">
        <div class="col-md-3 mb-3">
            <div class="stats-card">
                <div class="stats-number">{{ total }}</div>
                <div class="text-muted">Total Movies</div>
            </div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="stats-card">
                <div class="stats-number">{{ watched }}</div>
                <div class="text-muted">Watched</div>
            </div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="stats-card">
                <div class="stats-number">{{ watching }}</div>
                <div class="text-muted">Watching</div>
            </div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="stats-card">
                <div class="stats-number">{{ want }}</div>
                <div class="text-muted">Want to Watch</div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-6 mb-3">
            <div class="stats-card">
                <div class="stats-number">⭐ {{ avg_rating }}</div>
                <div class="text-muted">Average Your Rating</div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
