<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ movie.title }} - MovTracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container mt-5">
    <a href="/" class="btn btn-outline-light mb-4">← Back</a>

    <div class="row mt-3">
        <div class="col-md-4">
            {% if movie.poster_path %}
            <img src="https://image.tmdb.org/t/p/w500{{ movie.poster_path }}" class="img-fluid" style="border-radius: 20px; box-shadow: 0 15px 40px rgba(176,127,189,0.3);">
            {% endif %}
        </div>
        <div class="col-md-8">
            <h1 class="page-title">{{ movie.title }}</h1>
            <p class="text-muted">{{ movie.release_date }}</p>

            <div class="d-flex gap-3 mb-3">
                <div class="stats-card" style="padding: 15px 25px;">
                    <div style="font-family: 'Amatic SC'; font-size: 1.8rem; color: #b07fbd;">⭐ {{ movie.rating }}</div>
                    <div class="text-muted small">TMDB Rating</div>
                </div>
                <div class="stats-card" style="padding: 15px 25px;">
                    <div style="font-family: 'Amatic SC'; font-size: 1.8rem; color: #b07fbd;">⭐ {{ movie.my_rating or '—' }}</div>
                    <div class="text-muted small">Your Rating</div>
                </div>
                <div class="stats-card" style="padding: 15px 25px;">
                    <div style="font-family: 'Amatic SC'; font-size: 1.8rem; color: #b07fbd;">{{ movie.status }}</div>
                    <div class="text-muted small">Status</div>
                </div>
            </div>

            <p style="color: #6a5a7a; line-height: 1.8;">{{ movie.overview }}</p>
        </div>
    </div>
</div>
</body>
</html>
