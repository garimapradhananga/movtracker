<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MovieTracker{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container mt-4">

    {% if current_user.is_authenticated %}
    <div class="d-flex justify-content-end align-items-center gap-2 mb-2">
        <span class="text-muted small">signed in as <strong>{{ current_user.username }}</strong></span>
        <form action="{{ url_for('logout') }}" method="POST" class="m-0">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="btn btn-outline-light btn-sm">Log out</button>
        </form>
    </div>
    {% endif %}

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
    <div class="alert alert-{{ category }} mb-3" role="alert">{{ message }}</div>
    {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
</div>
</body>
</html>
